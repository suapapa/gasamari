<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2472"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f0f23"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#22c55e" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- G arc -->
  <path d="M 756 374 A 248 248 0 1 0 756 650"
        fill="none" stroke="#f8fafc" stroke-width="92"
        stroke-linecap="round"/>
  <!-- G crossbar in accent green -->
  <path d="M 548 528 H 756 V 650"
        fill="none" stroke="#22c55e" stroke-width="92"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- equalizer bars at the heart of the G -->
  <rect x="330" y="470" width="36" height="84" rx="18" fill="#f8fafc"/>
  <rect x="392" y="430" width="36" height="164" rx="18" fill="#f8fafc"/>
  <rect x="454" y="456" width="36" height="112" rx="18" fill="#f8fafc"/>
</svg>
