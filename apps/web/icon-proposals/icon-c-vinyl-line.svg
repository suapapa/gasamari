<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232052"/>
      <stop offset="1" stop-color="#0f0f23"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-120%" width="180%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#22c55e" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- vinyl record -->
  <circle cx="512" cy="492" r="274" fill="#14142e" stroke="#4338ca" stroke-width="26"/>
  <circle cx="512" cy="492" r="208" fill="none" stroke="#4338ca" stroke-width="10" opacity="0.65"/>
  <circle cx="512" cy="492" r="152" fill="none" stroke="#4338ca" stroke-width="10" opacity="0.45"/>
  <!-- sheen -->
  <path d="M 330 330 A 220 220 0 0 1 500 274"
        fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round" opacity="0.22"/>
  <!-- label + spindle hole -->
  <circle cx="512" cy="492" r="94" fill="#22c55e"/>
  <circle cx="512" cy="492" r="27" fill="#0f0f23"/>
  <!-- current lyric line overlapping the record -->
  <rect x="222" y="706" width="580" height="80" rx="40" fill="#22c55e" filter="url(#glow)"/>
  <circle cx="512" cy="746" r="24" fill="#f8fafc" stroke="#0f0f23" stroke-width="10"/>
</svg>
