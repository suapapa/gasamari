  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <!-- previous lyric line (dim) -->
  <rect x="322" y="312" width="380" height="54" rx="27" fill="#7c74e8" opacity="0.6"/>
  <!-- current lyric line (the only one highlighted) -->
