<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2472"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f0f23"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-120%" width="180%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#22c55e" flood-opacity="0.55"/>
