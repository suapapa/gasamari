[project]
name = "gasamari-api"
version = "0.1.0"
description = "Gasamari synced lyrics API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "syncedlyrics>=1.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
