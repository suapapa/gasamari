services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      LYRICS_CACHE_DIR: /app/cache/lyrics
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      # Share host cache with the container so locally fetched LRC survives
      # rebuilds and stays available when providers stop returning synced lyrics.
      - ./apps/api/cache/lyrics:/app/cache/lyrics
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?set SPOTIFY_CLIENT_ID in .env}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?set SPOTIFY_CLIENT_SECRET in .env}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-http://localhost:3000/api/auth/callback/spotify}
      # Always use Compose DNS. Do not inherit host .env API_BASE_URL
      # (http://127.0.0.1:8000 points at the web container itself).
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
